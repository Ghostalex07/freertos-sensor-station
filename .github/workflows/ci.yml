name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-fetchcontent:
    name: build-fetchcontent (kernel via FetchContent, con red)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain versions
        run: cmake --version && gcc --version

      # Cachea el clon de FreeRTOS-Kernel que descarga FetchContent en
      # build/_deps (localizacion por defecto) para reutilizarlo entre runs.
      # La clave lleva el tag para nunca restaurar un kernel de otra version.
      - name: Cache FetchContent (build/_deps)
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-V11.3.1-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-V11.3.1-${{ runner.os }}-

      - name: Configure (FetchContent, con red)
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: |
          rc=0
          timeout -k 1 6 ./build/sensor_station </dev/null > out.log 2>&1 || rc=$?
          echo "exit code: $rc (124 = terminado por timeout = esperado)"
          cat out.log
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::error::sensor_station termino con codigo inesperado: $rc"
            exit 1
          fi
          if ! grep -q "temperatura" out.log; then
            echo "::error::'temperatura' no aparece en la salida"
            exit 1
          fi
          if ! grep -q "stats:" out.log; then
            echo "::error::'stats:' no aparece en la salida"
            exit 1
          fi
          echo "Smoke test OK"

      # Suite de integracion TAP (bash, sin dependencias). Secuencial: el
      # puerto HTTP 8080 es fijo en C, nunca se ejecuta en paralelo.
      - name: Integration tests
        env:
          SENSOR_STATION_SEED: "42"
        timeout-minutes: 5
        run: bash tests/integration/run_all.sh ./build/sensor_station

      - name: Upload integration test logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: it-logs-build-fetchcontent
          path: ${{ runner.temp }}/it-logs/
          if-no-files-found: ignore

  build-kernel-local:
    name: build-kernel-local (kernel local, sin red)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout FreeRTOS-Kernel V11.3.1
        uses: actions/checkout@v5
        with:
          repository: FreeRTOS/FreeRTOS-Kernel
          ref: V11.3.1
          path: kernel

      - name: Toolchain versions
        run: cmake --version && gcc --version

      - name: Configure (kernel local, sin FetchContent)
        run: cmake -S . -B build -DFREERTOS_KERNEL_PATH="${{ github.workspace }}/kernel"

      - name: Build
        run: cmake --build build -j

      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: |
          rc=0
          timeout -k 1 6 ./build/sensor_station </dev/null > out.log 2>&1 || rc=$?
          echo "exit code: $rc (124 = terminado por timeout = esperado)"
          cat out.log
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::error::sensor_station termino con codigo inesperado: $rc"
            exit 1
          fi
          if ! grep -q "temperatura" out.log; then
            echo "::error::'temperatura' no aparece en la salida"
            exit 1
          fi
          if ! grep -q "stats:" out.log; then
            echo "::error::'stats:' no aparece en la salida"
            exit 1
          fi
          echo "Smoke test OK"

      # Suite de integracion TAP (bash, sin dependencias). Secuencial: el
      # puerto HTTP 8080 es fijo en C, nunca se ejecuta en paralelo.
      - name: Integration tests
        env:
          SENSOR_STATION_SEED: "42"
        timeout-minutes: 5
        run: bash tests/integration/run_all.sh ./build/sensor_station

      - name: Upload integration test logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: it-logs-build-kernel-local
          path: ${{ runner.temp }}/it-logs/
          if-no-files-found: ignore

  build-asan:
    name: build-asan (kernel local, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout FreeRTOS-Kernel V11.3.1
        uses: actions/checkout@v5
        with:
          repository: FreeRTOS/FreeRTOS-Kernel
          ref: V11.3.1
          path: kernel

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S . -B build
          -DFREERTOS_KERNEL_PATH="${{ github.workspace }}/kernel"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j

      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test instrumentado
        env:
          SENSOR_STATION_SEED: "42"
        run: |
          rc=0
          timeout -k 1 6 ./build/sensor_station </dev/null > out.log 2>&1 || rc=$?
          echo "exit code: $rc (124 = terminado por timeout = esperado)"
          cat out.log
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::error::sensor_station termino con codigo inesperado: $rc"
            exit 1
          fi
          if grep -qE "ERROR: |runtime error|SUMMARY: " out.log; then
            echo "::error::informes de ASan/UBSan en la salida"
            exit 1
          fi
          if ! grep -q "temperatura" out.log; then
            echo "::error::'temperatura' no aparece en la salida"
            exit 1
          fi
          echo "ASan smoke test OK"

      # Suite de integracion TAP (bash, sin dependencias). Secuencial: el
      # puerto HTTP 8080 es fijo en C, nunca se ejecuta en paralelo.
      - name: Integration tests
        env:
          SENSOR_STATION_SEED: "42"
        timeout-minutes: 5
        run: bash tests/integration/run_all.sh ./build/sensor_station

      - name: Upload integration test logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: it-logs-build-asan
          path: ${{ runner.temp }}/it-logs/
          if-no-files-found: ignore
