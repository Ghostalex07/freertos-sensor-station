name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck (integration scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # SC1091: the scripts source lib.sh through a computed path, which
      # shellcheck cannot follow without -x.
      - name: Lint test scripts
        run: shellcheck -e SC1091 tests/integration/*.sh

  build-fetchcontent:
    name: build-fetchcontent (kernel via FetchContent, with network)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain versions
        run: cmake --version && gcc --version

      # Caches the FreeRTOS-Kernel clone that FetchContent downloads into
      # build/_deps (default location) so it is reused between runs. The
      # key carries the tag so a kernel from another version is never
      # restored.
      - name: Cache FetchContent (build/_deps)
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-V11.3.1-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-V11.3.1-${{ runner.os }}-

      - name: Configure (FetchContent, with network)
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: |
          rc=0
          timeout -k 1 6 ./build/sensor_station </dev/null > out.log 2>&1 || rc=$?
          echo "exit code: $rc (124 = killed by timeout = expected)"
          cat out.log
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::error::sensor_station exited with an unexpected code: $rc"
            exit 1
          fi
          if ! grep -q "temperature" out.log; then
            echo "::error::'temperature' does not appear in the output"
            exit 1
          fi
          if ! grep -q "stats:" out.log; then
            echo "::error::'stats:' does not appear in the output"
            exit 1
          fi
          echo "Smoke test OK"

      # TAP integration suite (bash, no dependencies). Sequential: the
      # HTTP port 8080 is fixed in C, it never runs in parallel.
      - name: Integration tests
        env:
          SENSOR_STATION_SEED: "42"
        timeout-minutes: 5
        run: bash tests/integration/run_all.sh ./build/sensor_station

      - name: Upload integration test logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: it-logs-build-fetchcontent
          path: ${{ runner.temp }}/it-logs/
          if-no-files-found: ignore

  build-kernel-local:
    name: build-kernel-local (local kernel, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout FreeRTOS-Kernel V11.3.1
        uses: actions/checkout@v5
        with:
          repository: FreeRTOS/FreeRTOS-Kernel
          ref: V11.3.1
          path: kernel

      - name: Toolchain versions
        run: cmake --version && gcc --version

      - name: Configure (local kernel, without FetchContent)
        run: cmake -S . -B build -DFREERTOS_KERNEL_PATH="${{ github.workspace }}/kernel"

      - name: Build
        run: cmake --build build -j

      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: |
          rc=0
          timeout -k 1 6 ./build/sensor_station </dev/null > out.log 2>&1 || rc=$?
          echo "exit code: $rc (124 = killed by timeout = expected)"
          cat out.log
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::error::sensor_station exited with an unexpected code: $rc"
            exit 1
          fi
          if ! grep -q "temperature" out.log; then
            echo "::error::'temperature' does not appear in the output"
            exit 1
          fi
          if ! grep -q "stats:" out.log; then
            echo "::error::'stats:' does not appear in the output"
            exit 1
          fi
          echo "Smoke test OK"

      # TAP integration suite (bash, no dependencies). Sequential: the
      # HTTP port 8080 is fixed in C, it never runs in parallel.
      - name: Integration tests
        env:
          SENSOR_STATION_SEED: "42"
        timeout-minutes: 5
        run: bash tests/integration/run_all.sh ./build/sensor_station

      - name: Upload integration test logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: it-logs-build-kernel-local
          path: ${{ runner.temp }}/it-logs/
          if-no-files-found: ignore

  # Every queue, semaphore, event group, buffer, timer and task created
  # with its static API: pvPortMalloc is never called by the application,
  # so heap_free stays at (nearly) configTOTAL_HEAP_SIZE for the whole run.
  build-static:
    name: build-static (all static allocation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout FreeRTOS-Kernel V11.3.1
        uses: actions/checkout@v5
        with:
          repository: FreeRTOS/FreeRTOS-Kernel
          ref: V11.3.1
          path: kernel

      - name: Toolchain versions
        run: cmake --version && gcc --version

      - name: Configure (static allocation, local kernel)
        run: >
          cmake -S . -B build
          -DFREERTOS_KERNEL_PATH="${{ github.workspace }}/kernel"
          -DSENSOR_STATION_STATIC=ON

      - name: Build
        run: cmake --build build -j

      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        env:
          SENSOR_STATION_SEED: "42"
        run: |
          rc=0
          timeout -k 1 6 ./build/sensor_station </dev/null > out.log 2>&1 || rc=$?
          echo "exit code: $rc (124 = killed by timeout = expected)"
          cat out.log
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::error::sensor_station exited with an unexpected code: $rc"
            exit 1
          fi
          if ! grep -q "temperature" out.log; then
            echo "::error::'temperature' does not appear in the output"
            exit 1
          fi
          if ! grep -q "stats:" out.log; then
            echo "::error::'stats:' does not appear in the output"
            exit 1
          fi
          echo "Smoke test OK"

      # TAP integration suite (bash, no dependencies). Sequential: the
      # HTTP port 8080 is fixed in C, it never runs in parallel.
      - name: Integration tests
        env:
          SENSOR_STATION_SEED: "42"
        timeout-minutes: 5
        run: bash tests/integration/run_all.sh ./build/sensor_station

      - name: Upload integration test logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: it-logs-build-static
          path: ${{ runner.temp }}/it-logs/
          if-no-files-found: ignore

  build-asan:
    name: build-asan (local kernel, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout FreeRTOS-Kernel V11.3.1
        uses: actions/checkout@v5
        with:
          repository: FreeRTOS/FreeRTOS-Kernel
          ref: V11.3.1
          path: kernel

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S . -B build
          -DFREERTOS_KERNEL_PATH="${{ github.workspace }}/kernel"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j

      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Instrumented smoke test
        env:
          SENSOR_STATION_SEED: "42"
        run: |
          rc=0
          timeout -k 1 6 ./build/sensor_station </dev/null > out.log 2>&1 || rc=$?
          echo "exit code: $rc (124 = killed by timeout = expected)"
          cat out.log
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::error::sensor_station exited with an unexpected code: $rc"
            exit 1
          fi
          if grep -qE "ERROR: |runtime error|SUMMARY: " out.log; then
            echo "::error::ASan/UBSan reports in the output"
            exit 1
          fi
          if ! grep -q "temperature" out.log; then
            echo "::error::'temperature' does not appear in the output"
            exit 1
          fi
          echo "ASan smoke test OK"

      # TAP integration suite (bash, no dependencies). Sequential: the
      # HTTP port 8080 is fixed in C, it never runs in parallel.
      - name: Integration tests
        env:
          SENSOR_STATION_SEED: "42"
        timeout-minutes: 5
        run: bash tests/integration/run_all.sh ./build/sensor_station

      - name: Upload integration test logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: it-logs-build-asan
          path: ${{ runner.temp }}/it-logs/
          if-no-files-found: ignore
